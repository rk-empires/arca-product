<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sights — Nova Gallery</title>

  <link rel="icon" type="image/png" href="assets/generated/icon.png" />
  <link rel="apple-touch-icon" href="assets/generated/icon.png" />

  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --text: #e7ebf2;
      --muted: #9aa4b2;
      --accent: #5b8cff;
      --accent-2: #7c5cff;
      --border: #232938;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11,13,18,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    nav { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: var(--muted); font-size: 0.95rem; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 8px 24px rgba(91,140,255,0.25);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(91,140,255,0.35); }

    .hero {
      padding: 110px 0 80px;
      text-align: center;
      background: radial-gradient(900px 400px at 50% -10%, rgba(124,92,255,0.18), transparent);
    }
    .hero h1 { font-size: 3.2rem; letter-spacing: -0.03em; margin-bottom: 18px; }
    .hero p { color: var(--muted); font-size: 1.2rem; max-width: 620px; margin: 0 auto; }

    section { padding: 64px 0; }

    .gallery { columns: 3; column-gap: 18px; }
    .gallery figure {
      break-inside: avoid; margin-bottom: 18px; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); position: relative; background: var(--panel);
    }
    .gallery img { width: 100%; display: block; transition: transform .3s; }
    .gallery figure:hover img { transform: scale(1.05); }
    .gallery figcaption {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 14px 16px; font-size: 0.9rem; font-weight: 600;
      background: linear-gradient(transparent, rgba(11,13,18,0.9));
      opacity: 0; transition: opacity .25s;
    }
    .gallery figure:hover figcaption { opacity: 1; }

    footer { border-top: 1px solid var(--border); padding: 36px 0; text-align: center; color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 900px) { .gallery { columns: 2; } }
    @media (max-width: 600px) { .gallery { columns: 1; } .hero h1 { font-size: 2.3rem; } .nav-links { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a class="logo" href="product.html">Nova<span>.</span></a>
        <div class="nav-links">
          <a href="product.html">Product</a>
          <a href="TesterTech.html">Tester Tech</a>
          <a href="sights.html">Sights</a>
        </div>
        <a class="btn" href="TesterTech.html">Shop Gadgets</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Sights</h1>
      <p>A visual gallery of the Nova smart-gadget lineup and the worlds they live in.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="gallery">
        <figure><img src="assets/generated/smartwatch.png" alt="Pulse Smartwatch" /><figcaption>Pulse Smartwatch</figcaption></figure>
        <figure><img src="assets/generated/smart-glasses.png" alt="Vision Smart Glasses" /><figcaption>Vision Smart Glasses</figcaption></figure>
        <figure><img src="assets/generated/hero-bg.png" alt="Futuristic tech" /><figcaption>Future Tech</figcaption></figure>
        <figure><img src="assets/generated/earbuds.png" alt="Pro Wireless Earbuds" /><figcaption>Pro Wireless Earbuds</figcaption></figure>
        <figure><img src="assets/generated/smart-bulb.png" alt="Aura Smart Bulb" /><figcaption>Aura Smart Bulb</figcaption></figure>
        <figure><img src="assets/generated/voice-assistant.png" alt="Nova Voice Assistant" /><figcaption>Nova Voice Assistant</figcaption></figure>
        <figure><img src="assets/generated/smart-home-bg.png" alt="Smart Home" /><figcaption>Smart Home</figcaption></figure>
        <figure><img src="assets/generated/fitness-band.png" alt="Active Fitness Band" /><figcaption>Active Fitness Band</figcaption></figure>
        <figure><img src="assets/generated/smart-camera.png" alt="Guardian Smart Camera" /><figcaption>Guardian Smart Camera</figcaption></figure>
        <figure><img src="assets/generated/thermostat.png" alt="Climate Smart Thermostat" /><figcaption>Climate Smart Thermostat</figcaption></figure>
        <figure><img src="assets/generated/smart-display.png" alt="Smart Display Hub" /><figcaption>Smart Display Hub</figcaption></figure>
        <figure><img src="assets/generated/audio-bg.png" alt="Audio" /><figcaption>Audio &amp; Assistants</figcaption></figure>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Nova. All rights reserved. · <a href="product.html" style="color:var(--accent);">Back to Product</a></p>
    </div>
  </footer>
</body>
</html>
